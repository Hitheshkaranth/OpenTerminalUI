# Curated commodity -> linked companies (rewritten by QC; the first draft mislabelled TIO=F (iron ore) as titanium
# dioxide, mixed up tickers (AAL = American Airlines, not Anglo American) and listed Indian OMCs as helped by crude).
#   input_cost   : the company buys it -> a price rise HURTS it
#   output_price : the company sells/produces it -> a price rise HELPS it
# Every IN symbol is validated against data/nse_equity_symbols_all.txt by backend/tests/test_raw_material_links.py.

